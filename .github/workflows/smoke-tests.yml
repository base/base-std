name: Base Std Smoke Tests

# Advisory, MANUALLY-triggered smoke run of the FULL b20 suite against a LIVE Base network.
#
# workflow_dispatch ONLY — deliberately not pull_request / merge_group / schedule. Live chains are
# manually deployed per hardfork; CI cannot guarantee which precompile set is live, so an automated
# run would flap. This job never gates merges: it is a bring-up check you run by hand (e.g. after a
# hardfork ships to a network) to confirm the b20 surface behaves against the real Rust precompiles.
# It always runs the whole suite against the ref you dispatch from (latest = main) — there is no
# journey picker and no fork/ref selector (branch-per-fork: dispatch from the branch/tag that matches
# the fork you want). Each journey self-skips when the live chain is not yet on the fork that ships
# its surface (e.g. the ERC-8056 multiplier journey on a pre-Cobalt chain).
#
# Networks: the `network` input names a GitHub Environment. Each environment holds ONE secret,
# SMOKE_CONFIG, a JSON blob with everything network-specific (RPC URL, both private keys, optional
# faucet). Nothing network-specific or sensitive lives in git. See script/smoke/README.md
# ("Advisory CI") for the blob shape and how to add a network.

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Network to test = name of the GitHub Environment holding its SMOKE_CONFIG secret"
        required: true
        default: vibenet

# One run at a time per network: runs on the same chain share a deployer key (nonce collisions),
# runs on different chains are independent.
concurrency:
  group: smoke-${{ inputs.network }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke (${{ inputs.network }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.network }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout base-std
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@50d5a8956f2e319df19e6b57539d7e2acb9f8c1e # v1.5.0
        with:
          version: stable

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Set up smoke runner venv
        shell: bash
        # `make smoke-setup` (one-time venv + web3). setup-python makes python3 == 3.13, so point the
        # Makefile at it; make python-check still enforces 3.13.
        run: make smoke-setup PYTHON=python3

      - name: Load network config
        shell: bash
        # Unpack the environment's SMOKE_CONFIG JSON into the env vars the harness reads (RPC_URL,
        # DEPLOYER_PK, USER2_PK, optional FAUCET_*). Every value is masked BEFORE it is exported so
        # it can never appear in a log. An empty secret means the environment is missing/unconfigured
        # (GitHub silently creates an empty environment for an unknown name), so fail fast.
        env:
          SMOKE_CONFIG: ${{ secrets.SMOKE_CONFIG }}
          NETWORK: ${{ inputs.network }}
        run: |
          set -euo pipefail
          if [ -z "$SMOKE_CONFIG" ]; then
            echo "::error::No SMOKE_CONFIG secret for environment '$NETWORK'. Check the network name, or add the secret (see script/smoke/README.md)."
            exit 1
          fi
          if ! echo "$SMOKE_CONFIG" | jq -e 'type == "object"' >/dev/null 2>&1; then
            echo "::error::SMOKE_CONFIG for '$NETWORK' is not a valid JSON object."
            exit 1
          fi
          for key in rpc_url deployer_pk user2_pk; do
            if ! echo "$SMOKE_CONFIG" | jq -e --arg k "$key" '(.[$k] // "") | type == "string" and length > 0' >/dev/null 2>&1; then
              echo "::error::SMOKE_CONFIG for '$NETWORK' is missing required field '$key'."
              exit 1
            fi
          done

          export_field() { # <json key> <env var>
            local value
            value=$(echo "$SMOKE_CONFIG" | jq -r --arg k "$1" '.[$k] // empty')
            [ -n "$value" ] || return 0
            echo "::add-mask::$value"
            echo "$2=$value" >> "$GITHUB_ENV"
          }
          export_field rpc_url RPC_URL
          export_field deployer_pk DEPLOYER_PK
          export_field user2_pk USER2_PK
          export_field faucet_url FAUCET_URL
          export_field faucet_network FAUCET_NETWORK

      - name: Run the full smoke suite
        id: smoke
        shell: bash
        # Same as the local runbook: `make smoke-all KEEP_GOING=1` (which runs `forge build` first to
        # produce the interface ABIs). The Makefile sources .env when present, but existing env wins,
        # so the values exported by "Load network config" are used and no .env is written to disk.
        # KEEP_GOING runs every journey and prints a summary, so one journey's failure/skip never
        # masks the rest; it always exits 0, so the (advisory) job stays green and the summary below
        # reports the real per-journey status. continue-on-error still guards against an infra crash.
        continue-on-error: true
        run: |
          set -o pipefail
          make smoke-all KEEP_GOING=1 2>&1 | tee "$RUNNER_TEMP/smoke-output.txt"

      - name: Summarize smoke results
        if: always()
        shell: bash
        env:
          NETWORK: ${{ inputs.network }}
        run: |
          output="$RUNNER_TEMP/smoke-output.txt"
          # Chain id, as logged by the harness preflight ("preflight ok — chain=<id> ...").
          chain_id=$(grep -oE 'chain=[0-9]+' "$output" 2>/dev/null | head -1 | cut -d= -f2)
          chain_id=${chain_id:-unknown}

          # The -k runner prints "smoke summary: P passed, F failed, S skipped (of N)".
          summary=$(grep -oE 'smoke summary: [0-9]+ passed, [0-9]+ failed, [0-9]+ skipped' "$output" 2>/dev/null | tail -1)
          passed=$(echo "$summary" | grep -oE '[0-9]+ passed' | grep -oE '[0-9]+'); passed=${passed:-0}
          failed=$(echo "$summary" | grep -oE '[0-9]+ failed' | grep -oE '[0-9]+'); failed=${failed:-0}
          skipped=$(echo "$summary" | grep -oE '[0-9]+ skipped' | grep -oE '[0-9]+'); skipped=${skipped:-0}

          {
            echo "## Smoke Results"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Ref | \`${{ github.ref_name }}\` |"
            echo "| Network | \`${NETWORK}\` |"
            echo "| Chain id | \`${chain_id}\` |"
            echo "| Passed / Failed / Skipped | ${passed} / ${failed} / ${skipped} |"
            echo ""
            if [ -z "$summary" ]; then
              echo "❓ **Did not run** — no summary produced (likely an infra error before the suite ran, e.g. RPC unreachable). Check the run log."
            elif [ "$failed" -ne 0 ]; then
              echo "❌ **${failed} journey(s) failed** — an assertion or expected revert did not match. Advisory only; does not gate merges. See the run log for the failing journey and its trace."
            elif [ "$passed" -ne 0 ]; then
              echo "✅ **${passed} passed** (${skipped} skipped) — the b20 surface behaved against the live precompiles."
            else
              echo "⏭️ **All ${skipped} skipped** — the network is not on the expected fork yet (feature inactive or pre-fork). Chain/fork state, not a defect."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
