name: Base Std Smoke Tests (Vibenet)

# Advisory, MANUALLY-triggered smoke run against a LIVE Base network (Vibenet by default).
#
# workflow_dispatch ONLY — deliberately not pull_request / merge_group / schedule. Vibenet is a
# live chain, manually deployed per hardfork; CI cannot guarantee which precompile set is live, so
# an automated run would flap. This job never gates merges: it is a bring-up check you run by hand
# (e.g. after a hardfork ships to Vibenet) to confirm the b20 surface behaves against the real
# Rust precompiles. The branch-per-fork model applies: pick the base-std ref that matches the fork
# live on the target chain (latest = main; a prior hardfork = its pinned ref). There is no runtime
# fork selector. If the chain is not yet on the expected fork, the harness SKIPS (not fails).

on:
  workflow_dispatch:
    inputs:
      journey:
        description: "Smoke journey to run (e.g. multiplier, asset, all)"
        required: true
        default: multiplier
      fork:
        description: "Fork the target chain is expected to be on (informational; pick base-std ref to match)"
        required: true
        type: choice
        default: cobalt
        options:
          - cobalt
          - beryl
      base_std_ref:
        description: "base-std ref to run (latest = main; pin a prior hardfork's ref to match an older fork)"
        required: true
        default: main
      rpc_url:
        description: "JSON-RPC endpoint of the live chain"
        required: true
        default: https://rpc.vibes.base.org/

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    name: Vibenet smoke (${{ inputs.journey }} @ ${{ inputs.fork }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout base-std
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.base_std_ref }}
          fetch-depth: 1
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@50d5a8956f2e319df19e6b57539d7e2acb9f8c1e # v1.5.0
        with:
          version: stable

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Set up smoke runner venv
        shell: bash
        # setup-python makes python3 == 3.13; make python-check enforces it.
        run: make smoke-setup PYTHON=python3

      - name: Build contracts (interface ABIs the harness binds to)
        shell: bash
        run: forge build

      - name: Run Vibenet smoke journey
        id: smoke
        shell: bash
        # RPC_URL comes from the dispatch input; the two keys are repo secrets (never echoed). Fail-fast
        # (no -k): a genuine contract defect exits non-zero; a chain not on the expected fork exits 0 via
        # the harness skip. continue-on-error keeps the (advisory) job from going red on either outcome —
        # the summary below reports the real status.
        continue-on-error: true
        env:
          RPC_URL: ${{ inputs.rpc_url }}
          DEPLOYER_PK: ${{ secrets.SMOKE_DEPLOYER_PK }}
          USER2_PK: ${{ secrets.SMOKE_USER2_PK }}
        run: |
          set -o pipefail
          PYTHONPATH=script script/smoke/.venv/bin/python -m smoke "${{ inputs.journey }}" \
            2>&1 | tee "$RUNNER_TEMP/smoke-output.txt"
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Summarize smoke results
        if: always()
        shell: bash
        env:
          EXIT_CODE: ${{ steps.smoke.outputs.exit_code }}
        run: |
          output="$RUNNER_TEMP/smoke-output.txt"
          # Vibenet chain id, as logged by the harness preflight ("preflight ok — chain=<id> ...").
          chain_id=$(grep -oE 'chain=[0-9]+' "$output" 2>/dev/null | head -1 | cut -d= -f2)
          chain_id=${chain_id:-unknown}

          # Non-zero exit => a real contract defect (fail-fast). Exit 0 + a skip marker => chain not on
          # the expected fork (harness skip). Exit 0 + a journey "…: OK" line => pass.
          status="fail"
          if [ "${EXIT_CODE:-1}" = "0" ]; then
            if grep -qE 'not applicable|NOT ACTIVE|skipping' "$output" 2>/dev/null; then
              status="skip"
            elif grep -qE ': OK$' "$output" 2>/dev/null; then
              status="pass"
            fi
          fi

          {
            echo "## Vibenet Smoke Results"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Journey | \`${{ inputs.journey }}\` |"
            echo "| Expected fork | \`${{ inputs.fork }}\` |"
            echo "| base-std ref | \`${{ inputs.base_std_ref }}\` |"
            echo "| RPC endpoint | \`${{ inputs.rpc_url }}\` |"
            echo "| Chain id | \`${chain_id}\` |"
            echo ""
            case "$status" in
              pass) echo "✅ **Passed** — the b20 surface behaved against the live precompiles." ;;
              skip) echo "⏭️ **Skipped** — Vibenet is not on \`${{ inputs.fork }}\` yet (feature inactive or pre-fork). This is chain/fork state, not a defect." ;;
              *)    echo "❌ **Failed** — an assertion or expected revert did not match. Advisory only; does not gate merges. Check the run log." ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
