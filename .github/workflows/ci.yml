name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Build
        run: forge build

      - name: Contract sizes (informational)
        run: forge build --sizes || true

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Run tests
        run: forge test -v

  forge-coverage:
    name: Forge Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Generate lcov report
        run: forge coverage --no-match-coverage "(\.t\.sol|Test\.sol)$" --report lcov

      - name: Capture coverage summary
        id: summary
        run: |
          raw=$(forge coverage --no-match-coverage "(\.t\.sol|Test\.sol)$" 2>/dev/null | grep "^|" || echo "")

          if [ -z "$raw" ]; then
            status="⚠️ Coverage data unavailable."
            table="_(no coverage data)_"
          else
            # Transform forge output into a proper GFM table:
            # - strip test/lib/mocks/ and src/lib/ path prefixes
            # - show percentages only (drop raw hit counts)
            # - add per-row emoji: ✅ for 100%, ⚠️ otherwise
            table=$(echo "$raw" | awk -v CHECK="✅" -v WARN="⚠️" -F'|' '
              BEGIN {
                print "| File | Lines | Stmts | Branches | Funcs |"
                print "|------|-------|-------|----------|-------|"
              }
              /\+/ { next }
              /% Lines/ { next }
              NF < 5 { next }
              {
                file = $2
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", file)
                if (file == "") next
                for (i = 3; i <= 6; i++) {
                  match($i, /[0-9]+\.[0-9]+%/)
                  pct[i-2] = substr($i, RSTART, RLENGTH)
                }
                gsub(/^test\/lib\/mocks\//, "", file)
                gsub(/^src\/lib\//, "", file)
                all100 = (pct[1]=="100.00%" && pct[2]=="100.00%" && pct[3]=="100.00%" && pct[4]=="100.00%")
                if (file == "Total") {
                  printf "| **%s** | **%s** | **%s** | **%s** | **%s** |\n", file, pct[1], pct[2], pct[3], pct[4]
                } else if (all100) {
                  printf "| %s %s | %s | %s | %s | %s |\n", CHECK, file, pct[1], pct[2], pct[3], pct[4]
                } else {
                  printf "| %s %s | %s | %s | %s | %s |\n", WARN, file, pct[1], pct[2], pct[3], pct[4]
                }
              }
            ')

            total=$(echo "$raw" | grep "^| Total" || echo "")
            if echo "$total" | grep -qE "100\.00%[^|]+100\.00%[^|]+100\.00%[^|]+100\.00%"; then
              status="🟢 **100% coverage** — all lines, statements, branches, and functions hit."
            else
              status="🟡 Near-full coverage — one or more metrics below 100%."
            fi
          fi

          {
            echo "status=$status"
            echo "table<<__EOF__"
            printf "%s\n" "$table"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Upload lcov report
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info

      - name: Find existing comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/find-comment@v3
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: <!-- forge-coverage -->

      - name: Post or update PR comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            <!-- forge-coverage -->
            ### 📊 Forge Coverage (`src/lib/`)

            ${{ steps.summary.outputs.status }}

            ${{ steps.summary.outputs.table }}

            Full report: [download artifact](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}). To browse locally: `make coverage` (runs forge coverage + genhtml + opens the HTML report).

  interface-coverage:
    name: Interface Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Run interface coverage check
        id: check
        run: |
          set +e
          output=$(python3 scripts/check-coverage.py 2>&1)
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          {
            echo "output<<__EOF__"
            echo "$output"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"
          exit $exit_code
        continue-on-error: true

      - name: Find existing comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/find-comment@v3
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: <!-- interface-coverage -->

      - name: Post or update PR comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            <!-- interface-coverage -->
            ### Interface Coverage

            ${{ steps.check.outputs.exit_code == '0' && '✅ All interface functions have test coverage.' || '❌ Interface functions with no test coverage found.' }}

            ${{ steps.check.outputs.exit_code != '0' && format('```\n{0}\n```', steps.check.outputs.output) || '' }}

      - name: Fail if gaps found
        if: steps.check.outputs.exit_code != '0'
        run: exit 1

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Check formatting
        run: forge fmt --check
